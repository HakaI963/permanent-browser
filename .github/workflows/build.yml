name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The ubuntu-latest image already has an Android SDK at $ANDROID_HOME.
      # Only ensure the exact platform + build-tools we compile against exist.
      - name: Ensure Android SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Using SDK at $SDK"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
            "$SDKMGR" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools" || true
          else
            echo "sdkmanager not found; relying on preinstalled platform 35"
          fi
          ls "$SDK/platforms" || true

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Rename artifacts
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/permanent-browser-debug.apk
          cp app/build/outputs/apk/release/app-release.apk out/permanent-browser-release.apk
          ls -lh out

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: permanent-browser-debug
          path: out/permanent-browser-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: permanent-browser-release
          path: out/permanent-browser-release.apk
          if-no-files-found: error

      - name: Attach APKs to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/permanent-browser-debug.apk
            out/permanent-browser-release.apk
          generate_release_notes: true
          body: |
            ## Permanent Browser ${{ github.ref_name }}

            A browser that never reloads your pages.

            - `permanent-browser-release.apk` — smaller, minified (signed with a debug key, sideload only)
            - `permanent-browser-debug.apk` — easier to inspect with `adb logcat`

            Install with `adb install -r permanent-browser-release.apk`.
